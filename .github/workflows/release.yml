name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)build assets for (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  build-ui:
    name: Build frontend UI
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build frontend
        run: nix develop --no-update-lock-file .#frontend --command sh -c 'cd ui && npm ci && npm run build'

      - name: Upload frontend dist
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: ui/dist/
          if-no-files-found: error
          retention-days: 1

  build:
    needs: build-ui
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux-musl
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            profile: release-musl
          - name: aarch64-linux-musl
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            profile: release-musl

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Download frontend dist
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: ui/dist/

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building tag: ${TAG}"

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo/registry
            .cargo/git
            target
          # matrix.name uniquely identifies the build variant and (unlike
          # matrix.features) contains no commas, which cache keys disallow.
          key: cargo-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.name }}-

      - name: Build and verify binary from flake toolchain
        run: nix develop --no-update-lock-file .#${{ matrix.profile }} --command just build-release ${{ matrix.profile }}

      - name: Verify reproducible Linux binary
        run: nix develop --no-update-lock-file .#release-tools --command just verify-release-repro ${{ matrix.profile }}

      - name: Package asset
        run: nix develop --no-update-lock-file .#release-tools --command just package-release ${{ matrix.profile }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: binary-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download binary artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: true

      - name: Build combined checksums.txt
        working-directory: artifacts
        run: |
          nix develop --no-update-lock-file ..#release-tools --command sh -c '
            cat *.sha256 | sort -k2 > checksums.txt
            rm -f *.sha256
            sha256sum --check checksums.txt
          '

      - name: Upload assets to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            artifacts/*
          fail_on_unmatched_files: true
          # If `just mark-release` already created the release with notes,
          # this action just appends the assets and leaves the body alone.

      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}
          path: _repo_checkout
          fetch-depth: 1

      - name: Move latest tag
        working-directory: _repo_checkout
        run: |
          git tag -f latest
          git push origin latest --force

      - name: Upload assets to latest release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          make_latest: false
          files: |
            artifacts/*
          fail_on_unmatched_files: true
