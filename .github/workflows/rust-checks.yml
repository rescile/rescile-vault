name: Rust checks

# Temporary: run manually; restore push/pull_request triggers to re-enable CI.
on:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check frontend and Rust
        run: nix develop --no-update-lock-file .#default --command just rust-check
