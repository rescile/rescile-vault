[package]
name = "rescile-vault"
version = "0.5.5"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "rescile-vault"
path = "src/vault_client/main.rs"

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
base64 = "0.22.1"
clap = { version = "4.5.21", features = ["derive", "env"] }
hkdf = "0.12.4"
blake3 = "1.5.1"
humantime = "2.3.0"
rand = "0.8.5"
reqwest = { version = "0.12.24", features = ["json", "blocking"] }
serde = { version = "1.0.126", features = ["derive"] }
serde_json = "1.0.128"
sha2 = "0.10.9"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
openssl-sys = { version = "0.9", optional = true }
tss-esapi = { version = "7.7", optional = true }
rust-embed = "8.11.0"
tiny_http = "0.12.0"
mime_guess = "2.0.5"

[features]
openssl-vendored = ["openssl-sys/vendored"]
tpm = ["tss-esapi"]
